events {
    worker_connections 2048;
}

http {
    upstream grudge_backend {
        server grudge-server:3000;
        keepalive 32;
    }

    # Security headers
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;

    # --- HTTP: redirect all traffic to HTTPS ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS: main server (Cloudflare origin cert) ---
    server {
        listen 443 ssl http2;
        server_name _;

        # Cloudflare origin certificate
        ssl_certificate     /etc/nginx/ssl/origin.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Auth endpoints: stricter rate limit ---
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://grudge_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- General API endpoints ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://grudge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # --- WebSocket: real-time game + crew + global ---
        location /ws {
            limit_req zone=ws_limit burst=10 nodelay;

            proxy_pass http://grudge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            keepalive_timeout   86400;
        }

        # --- Socket.IO (Colyseus / GRUDA Legion) ---
        location /socket.io/ {
            limit_req zone=ws_limit burst=10 nodelay;

            proxy_pass http://grudge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
        }

        # --- Health check (no logging, no rate limit) ---
        location /health {
            proxy_pass http://grudge_backend/health;
            access_log off;
        }

        # --- Static files ---
        location /static/ {
            alias /var/www/grudge-warlords/current/public/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
