version: '3.8'

services:
  # Game Server
  grudge-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grudge-warlords-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?DB_NAME must be set}
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./builds:/app/builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grudge-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # PostgreSQL Database — internal only, no exposed ports
  postgres:
    image: postgres:15-alpine
    container_name: grudge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set}
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - grudge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  # Redis Cache — internal only, no exposed ports
  redis:
    image: redis:7-alpine
    container_name: grudge-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - grudge-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Headless Unity Game Server (dedicated)
  grudge-unity:
    build:
      context: .
      dockerfile: deployment/Dockerfile.unity
    container_name: grudge-unity-server
    restart: unless-stopped
    ports:
      - "${UNITY_SERVER_PORT:-7777}:7777/tcp"
      - "${UNITY_SERVER_PORT:-7777}:7777/udp"
    environment:
      - UNITY_SERVER_PORT=${UNITY_SERVER_PORT:-7777}
      - UNITY_MAX_PLAYERS=${UNITY_MAX_PLAYERS:-100}
      - UNITY_TICK_RATE=${UNITY_TICK_RATE:-30}
      - GAME_SERVER_NAME=${GAME_SERVER_NAME:-Grudge Warlords Dedicated}
      - GAME_SERVER_REGION=${GAME_SERVER_REGION:-us-east-1}
      - GRUDGE_API_URL=http://grudge-server:3000
    volumes:
      - ./logs:/server/logs
      - ./builds/server:/server/builds:ro
    depends_on:
      grudge-server:
        condition: service_healthy
    networks:
      - grudge-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: grudge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
    depends_on:
      grudge-server:
        condition: service_healthy
    networks:
      - grudge-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:

networks:
  grudge-network:
    driver: bridge
